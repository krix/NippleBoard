<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TV Total NippleBoard">
  <title>TV Total NippleBoard</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/logo.png?v=3" type="image/png" sizes="any">
  <link rel="shortcut icon" href="./icons/logo.png?v=3" type="image/png">
  <link rel="apple-touch-icon" href="./icons/logo.png?v=3">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-mark"><img src="./icons/logo.png?v=3" alt="" class="brand-logo"><span class="brand-name">TV Total NippleBoard</span></h1>
      <span id="offlineBadge" class="badge hidden" aria-live="polite">Offline</span>
    </div>
    <div class="controls">
      <label class="search-wrap" for="searchInput">
        <span class="sr-only">Suche</span>
        <input id="searchInput" type="search" placeholder="Suchen…" autocomplete="off">
      </label>
      <label class="toggle">
        <input id="editToggle" type="checkbox">
        <span>Bearbeiten</span>
      </label>
      <button id="installBtn" type="button" class="btn secondary hidden">Installieren</button>
      <button id="menuBtn" type="button" class="btn secondary" aria-expanded="false" aria-controls="menuPanel">Menü</button>
    </div>
  </header>

  <div id="menuPanel" class="menu-panel hidden" role="region" aria-label="Menü">
    <div class="menu-row">
      <button id="exportBtn" type="button" class="btn">Einstellungen exportieren</button>
      <button id="importBtn" type="button" class="btn">Einstellungen importieren</button>
      <input id="importFile" type="file" accept="application/json" class="hidden">
    </div>
    <div class="menu-row">
      <button id="resetDataBtn" type="button" class="btn danger">App-Daten zurücksetzen</button>
    </div>
    <p id="storageHint" class="hint"></p>
    <p id="iosHint" class="hint hidden">iOS: Über das Teilen-Menü „Zum Home-Bildschirm“ hinzufügen, um die App zu installieren.</p>
  </div>

  <div id="statusBar" class="status-bar" aria-live="polite"></div>
  <div id="cacheProgress" class="cache-progress hidden" aria-live="polite">
    <div class="cache-progress-text" id="cacheProgressText"></div>
    <div class="cache-progress-track"><div id="cacheProgressFill" class="cache-progress-fill"></div></div>
  </div>

  <main>
    <p id="editHint" class="hint hidden">Bearbeiten-Modus: Tippe auf einen Button zum Bearbeiten. Ziehen zum Sortieren.</p>
    <div id="grid" class="grid" aria-label="Clip-Raster"></div>
    <p id="emptyState" class="empty hidden">Keine Clips gefunden.</p>
  </main>

  <div id="editorModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editorHeading">
    <div class="modal-inner">
      <h2 id="editorHeading">Button bearbeiten</h2>
      <form id="editorForm">
        <label>Titel
          <input id="editTitle" type="text" maxlength="80" required>
        </label>
        <div class="editor-image">
          <div class="thumb-preview" id="editThumbPreview"></div>
          <div class="editor-image-actions">
            <label class="btn secondary file-btn">Eigenes Bild wählen
              <input id="editImageFile" type="file" accept="image/*" class="hidden">
            </label>
            <button id="framePickBtn" type="button" class="btn secondary">Frame aus Video wählen</button>
            <button id="resetImageBtn" type="button" class="btn secondary">Automatisches Vorschaubild</button>
          </div>
        </div>
        <div id="framePicker" class="frame-picker hidden">
          <video id="frameVideo" muted playsinline></video>
          <label>Position
            <input id="frameSlider" type="range" min="0" max="0" step="0.05" value="0">
          </label>
          <button id="captureFrameBtn" type="button" class="btn">Frame übernehmen</button>
        </div>
        <label class="toggle"><input id="editHidden" type="checkbox"> <span>Button ausblenden</span></label>
        <div class="modal-actions">
          <button type="button" id="cancelEditBtn" class="btn secondary">Abbrechen</button>
          <button type="submit" class="btn primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <template id="cardTemplate">
    <button type="button" class="clip-card" draggable="false">
      <span class="drag-handle" aria-hidden="true">⋮⋮</span>
      <span class="thumb"><span class="thumb-fallback"></span></span>
      <span class="title"></span>
      <span class="hidden-badge">Ausgeblendet</span>
    </button>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
